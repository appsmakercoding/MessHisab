name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android প্ল্যাটফর্ম ফাইল তৈরি (না থাকলে)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.hasan.messhisab
          fi

      - name: minSdk 23 সেট (Firebase এর জন্য)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - run: flutter pub get

      - name: APK বিল্ড
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mess-hisab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
